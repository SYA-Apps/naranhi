<!DOCTYPE html>
<html>
<head>
  <!--
    🛡️ 주소가 빗금 둘(`//naranhi/`)로 열리면 바른 주소로 다시 연다 — **맨 위에 있어야 한다.**
    Flutter 가 `//naranhi/` 를 «다른 사이트» 로 읽어 history.replaceState 에서 SecurityError 로
    멈추고 **회색 화면**만 남는다. 2026-09-11 아이폰에서 소담 대문을 거쳐 들어오다 실제로 그랬다
    (대문은 고쳤지만 다른 곳에서 `//` 링크로 들어와도 스스로 막는다).
    경위: C:\SYA\playbook\함정-모음.md 2026-09-11 «빗금이 두 개».
  -->
  <script>if(location.pathname.indexOf('//')===0)location.replace(location.pathname.replace(/^\/+/,'/')+location.search+location.hash);</script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/naranhi/">

  <meta charset="UTF-8">
  <!-- 로딩 표시가 처음부터 제 크기로 — Flutter 는 이 줄을 엔진이 뜬 뒤에야 넣어서, 그 전엔 아이폰이 980px 로 그려 아이콘이 작게 보였다가 커진다(2026-09-29) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="읽은 책을 책장에 꽂아 두는 독서기록 앱">

  <!-- 링크 공유 카드 (Open Graph / 트위터). 카톡·아이메시지 등이 링크를 카드로 보여줄 때 읽는다.
       크롤러만 읽으므로 앱(웹)은 이 그림을 부르지 않는다 — '외부 요청 0건' 이 안 깨진다.
       ⚠️ og:image·og:url 은 반드시 절대 URL (상대경로면 크롤러가 못 읽는다). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="나란히">
  <meta property="og:title" content="나란히 · 함께 쓰는 독서 책장">
  <meta property="og:description" content="친구와 한 책장을 함께 채우는 독서기록 앱. 읽은 책을 꽂고 서로의 책장을 나란히 봐요.">
  <meta property="og:url" content="https://sya-apps.github.io/naranhi/">
  <meta property="og:image" content="https://sya-apps.github.io/naranhi/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="나란히 — 책 네 권이 선 책장">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="나란히 · 함께 쓰는 독서 책장">
  <meta name="twitter:description" content="친구와 한 책장을 함께 채우는 독서기록 앱.">
  <meta name="twitter:image" content="https://sya-apps.github.io/naranhi/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="나란히">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>나란히 - 함께 쓰는 독서 책장</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- 첫 화면 로딩 표시 (2026-09-28 ADMIN) — Flutter 웹은 첫 방문에 3MB 안팎을 받는다.
       그동안 흰 화면만 보이면 안 열리는 것으로 읽힌다. 첫 프레임이 그려지면 스스로 사라진다. -->
  <style>
    #sya-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:14px;background:#fbfaf8;color:#6b665e;
      font:15px/1.5 -apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
      transition:opacity .25s ease}
    #sya-splash img{width:84px;height:84px;border-radius:21px}
    #sya-splash .bar{width:124px;height:4px;border-radius:99px;background:#e9e5dd;overflow:hidden}
    #sya-splash .bar i{display:block;width:40%;height:100%;border-radius:99px;background:#a89c8a;
      animation:sya-slide 1.1s ease-in-out infinite}
    @keyframes sya-slide{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}
    @media (prefers-color-scheme: dark){#sya-splash{background:#1b1a18;color:#b9b2a6}
      #sya-splash .bar{background:#302e2a}}
  </style>
  <div id="sya-splash">
    <img src="icons/Icon-192.png" alt="">
    <div>불러오는 중…</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('sya-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>

  <!--
    🐌 앱 파일 캐시(web/sw.js · 2026-09-30 땀방울 본보기). 번호는 배포 때 tool/stamp_web.py 가 박는다 —
    안 박혔으면(`_` 로 시작) 등록하지 않는다(그래서 잊어도 망가지지 않고 예전처럼 느릴 뿐이다).

    🧹 옛 판이 남긴 **다른** 서비스워커(Flutter 기본 flutter_service_worker.js)는 지운다.
    🚨 **나란히 것만** — getRegistrations() 는 `sya-apps.github.io` 전체를 준다. 거르지 않으면
    이웃 앱(쿵짝·사랑나라·땀방울 …)의 워커까지 지운다(2026-09-11 ADMIN 발견). 우리 sw.js 는 남긴다.
  -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations()
        .then(function (regs) {
          regs.forEach(function (reg) {
            var w = reg.active || reg.waiting || reg.installing;
            var url = w ? w.scriptURL : '';
            if (reg.scope.indexOf('/naranhi/') !== -1 && url.indexOf('/sw.js') === -1) reg.unregister();
          });
        })
        .catch(function () {});
      var B = 'dff95d1cae3e';
      if (B.charAt(0) === '_') return;
      navigator.serviceWorker.register('sw.js?b=' + B).catch(function () {});
      addEventListener('flutter-first-frame', function () {
        setTimeout(function () {
          navigator.serviceWorker.ready.then(function (r) {
            var list = performance.getEntriesByType('resource').map(function (e) { return e.name; });
            if (r.active) r.active.postMessage({ warm: list });
          }).catch(function () {});
        }, 2000); // 첫 화면이 뜬 뒤 글꼴·그림까지 다 받은 다음에
      });
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
