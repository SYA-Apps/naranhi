<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/naranhi/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="읽은 책을 책장에 꽂아 두는 독서기록 앱">

  <!-- 링크 공유 카드 (Open Graph / 트위터). 카톡·아이메시지 등이 링크를 카드로 보여줄 때 읽는다.
       크롤러만 읽으므로 앱(웹)은 이 그림을 부르지 않는다 — '외부 요청 0건' 이 안 깨진다.
       ⚠️ og:image·og:url 은 반드시 절대 URL (상대경로면 크롤러가 못 읽는다). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="나란히">
  <meta property="og:title" content="나란히 · 함께 쓰는 독서 책장">
  <meta property="og:description" content="친구와 한 책장을 함께 채우는 독서기록 앱. 읽은 책을 꽂고 서로의 책장을 나란히 봐요.">
  <meta property="og:url" content="https://sya-apps.github.io/naranhi/">
  <meta property="og:image" content="https://sya-apps.github.io/naranhi/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="나란히 — 책 네 권이 선 책장">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="나란히 · 함께 쓰는 독서 책장">
  <meta name="twitter:description" content="친구와 한 책장을 함께 채우는 독서기록 앱.">
  <meta name="twitter:image" content="https://sya-apps.github.io/naranhi/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="나란히">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>나란히 - 함께 쓰는 독서 책장</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    이전 빌드가 등록해 둔 서비스워커를 지운다. 나란히는 서비스워커를 끄고
    빌드하는데(--pwa-strategy=none), 이미 아이폰 홈화면에 추가된 사람은 그 전에
    등록된 서비스워커가 여전히 남아 있어 새 배포가 안 보이는 문제가 이어진다.
    한 번 지우면 그다음부터는 애초에 등록이 안 되니 이 코드도 할 일이 없어진다.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((regs) => regs.forEach((reg) => reg.unregister()))
        .catch(() => {});
    }
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
